<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run Results</title>
<link rel="stylesheet" href="/web/css/style.css">
<style>
  body { display: block; overflow: auto; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 16px; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 12px; }
  svg { width: 100%; height: 300px; display: block; }
  svg text { fill: var(--muted); font: 11px system-ui, sans-serif; }
  .axis line, .axis path { stroke: var(--line); }
  table { margin-top: 12px; }
</style>
</head>
<body>
<h1>Feel the delay — results</h1>
<p class="lead">Every finished run on this computer (results/runs.csv). Dots = runs, line = mean per delay.</p>
<div class="charts">
  <div class="panel"><div class="panel-title">Task time [s] vs. one-way delay</div><svg id="c-time"></svg></div>
  <div class="panel"><div class="panel-title">Idle fraction (no key pressed) vs. delay</div><svg id="c-idle"></svg></div>
  <div class="panel"><div class="panel-title">Number of waits (&gt; 0.5 s pauses) vs. delay</div><svg id="c-waits"></svg></div>
  <div class="panel"><div class="panel-title">Collisions vs. delay</div><svg id="c-coll"></svg></div>
</div>
<div class="panel" style="margin-top:12px"><table id="tbl"></table></div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent?.appendChild(e); return e; };

function chart(svg, rows, key) {
  svg.innerHTML = '';
  const W = svg.clientWidth || 500, H = 300, m = { l: 44, r: 12, t: 10, b: 30 };
  const delays = [...new Set(rows.map((r) => +r.delay_ms))].sort((a, b) => a - b);
  if (!delays.length) { el('text', { x: W / 2, y: H / 2, 'text-anchor': 'middle' }, svg).textContent = 'no runs yet'; return; }
  const ymax = Math.max(1e-9, ...rows.map((r) => +r[key])) * 1.1;
  const x = (d) => m.l + (delays.indexOf(d) + 0.5) * (W - m.l - m.r) / delays.length;
  const y = (v) => H - m.b - v / ymax * (H - m.t - m.b);
  for (let i = 0; i <= 4; i++) {
    const v = ymax * i / 4;
    el('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: 'var(--line)' }, svg);
    el('text', { x: m.l - 6, y: y(v) + 4, 'text-anchor': 'end' }, svg).textContent = v < 1 ? v.toFixed(2) : v.toFixed(0);
  }
  for (const d of delays) el('text', { x: x(d), y: H - 10, 'text-anchor': 'middle' }, svg).textContent = d >= 1000 ? `${d / 1000} s` : `${d} ms`;
  const means = delays.map((d) => { const v = rows.filter((r) => +r.delay_ms === d).map((r) => +r[key]); return v.reduce((a, b) => a + b, 0) / v.length; });
  el('polyline', { points: delays.map((d, i) => `${x(d)},${y(means[i])}`).join(' '), fill: 'none', stroke: 'var(--text)', 'stroke-width': 2, opacity: 0.7 }, svg);
  rows.forEach((r, i) => {
    const jitter = ((i * 37) % 11 - 5) * 3;
    const c = el('circle', { cx: x(+r.delay_ms) + jitter, cy: y(+r[key]), r: 5, fill: '#4cc2ff', opacity: 0.85 }, svg);
    el('title', {}, c).textContent = `${r.finished_at}: ${r[key]}`;
  });
}

async function load() {
  const rows = await (await fetch('/api/results')).json();
  chart(document.getElementById('c-time'), rows, 'task_time_s');
  chart(document.getElementById('c-idle'), rows, 'idle_frac');
  chart(document.getElementById('c-waits'), rows, 'waits');
  chart(document.getElementById('c-coll'), rows, 'collisions');
  const cols = ['finished_at', 'delay_ms', 'jitter_ms', 'loss', 'task_time_s', 'collisions', 'idle_frac', 'waits', 'path_m'];
  document.getElementById('tbl').innerHTML = `<thead><tr>${cols.map((c) => `<th>${c}</th>`).join('')}</tr></thead>` +
    `<tbody>${rows.slice().reverse().map((r) => `<tr>${cols.map((c) => `<td>${r[c]}</td>`).join('')}</tr>`).join('')}</tbody>`;
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
